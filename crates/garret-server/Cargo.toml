[package]
name = "garret-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
futures = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
axum = "0.8"
tracing = "0.1"
garret-common.workspace = true
anyhow = "1"
aws-config = "1"
aws-sdk-s3 = "1"
base64 = "0.22"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

# x86_64 gets SHA-NI via sha2's runtime detection; aarch64 needs the asm
# feature to use the ARMv8 SHA-256 extensions (ticket 20).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
