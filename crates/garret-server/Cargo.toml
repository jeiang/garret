[package]
name = "garret-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot = "0.12"
bytes = "1"
futures = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "service", "tokio"] }
garret-common.workspace = true
anyhow = "1"
# No legacy `rustls` feature on aws-sdk-s3: it selects the hyper 0.14 /
# rustls 0.21 client. `default-https-client` brings hyper 1 + rustls 0.23.
# sigv4a (multi-region access points) is unused.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio"] }
base64 = "0.22"
# aws_lc_rs: aws-lc-rs is already in the tree via rustls 0.23; rust_crypto would add the rsa crate stack.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

# x86_64 gets SHA-NI via sha2's runtime detection; aarch64 needs the asm
# feature to use the ARMv8 SHA-256 extensions (ticket 20).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Paused clocks, so timeout tests don't wait out real minutes.
tokio = { version = "1", features = ["test-util"] }
