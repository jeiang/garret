[package]
name = "garret-pusher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot = "0.12"
bytes = "1"
metrics = "0.24"
garret-common.workspace = true
garret-server.workspace = true
anyhow = "1"
axum = "0.8"
fastrand = "2"
futures = "0.3"
rusqlite = "0.37"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
zstd = "0.13"

# x86_64 gets SHA-NI via sha2's runtime detection; aarch64 needs the asm
# feature to use the ARMv8 SHA-256 extensions (ticket 20). The verifier is
# the only upload-path hasher left.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
garret-server = { workspace = true, features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
