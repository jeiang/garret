name: CI

on:
  push:
    branches: [main]
    # Releases are pinned too, so they get the same build and push as main.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes the previous run's result irrelevant, so
# pull request runs share one group per ref and cancel each other. Every other
# run gets a group of its own: consumers pin arbitrary main revisions and
# install `github:jeiang/garret/<rev>#garret`, so each one must run through to
# its push. A shared group would not do even without cancel-in-progress, since
# GitHub keeps only one pending run per group and cancels the one it replaces.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- lint ---
  lint:
    name: lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.GARRET_PULLER }}
            extra-trusted-public-keys = ${{ vars.GARRET_PUBLIC_KEY }}

      # clippy -D warnings, then cargo fmt --check.
      - name: Lints and formatting
        run: nix develop --command just check

  # ---------------------------------------------------------------- build ---
  build:
    name: build (${{ matrix.os }})
    strategy:
      # A darwin-only break is still worth seeing when linux is green.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # macos-latest is aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # `garret` itself is the cache once it is running: when the repository
          # variables below are set, every job substitutes from it instead of
          # rebuilding. Empty values are simply inert lines in nix.conf.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.GARRET_PULLER }}
            extra-trusted-public-keys = ${{ vars.GARRET_PUBLIC_KEY }}

      # garret-all is the workspace; the others are the per-binary wrappers
      # consumers actually install (`#garret`) and the NixOS modules run by
      # default (`garret-pusher`, `garret-puller`). Each is its own store path,
      # so a cache holding only garret-all still leaves them to be built.
      # garret-all goes first so ./result stays the workspace.
      - name: Build all binaries
        run: |
          nix build --print-build-logs --print-out-paths \
            .#garret-all .#garret .#garret-pusher .#garret-puller .#garret-admin \
            > out-paths.txt

      - name: Show what was built
        run: ls -l result/bin

      # The whole closure, not just garret's own path: `nix-store --import`
      # refuses a path whose references are not already in the store, and the
      # importing job has no way to fetch them without building.
      - name: Export the build closure
        # Store paths never contain whitespace; the splitting is the point.
        run: |
          # shellcheck disable=SC2046
          nix-store --export $(nix-store --query --requisites $(cat out-paths.txt)) > closure.nar

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          # The push job wants both closures; e2e wants only the linux one.
          name: garret-closure-${{ matrix.os }}
          path: |
            closure.nar
            out-paths.txt
          # Only ever consumed by the jobs below, in this same run.
          retention-days: 1
          compression-level: 1

  # ----------------------------------------------------------------- test ---
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.GARRET_PULLER }}
            extra-trusted-public-keys = ${{ vars.GARRET_PUBLIC_KEY }}

      # buildRustPackage's check phase already runs these inside `build`, but
      # only there: a green `build` is not a legible test report, and a broken
      # test is a test failure, not a build failure.
      - name: Application tests
        run: nix develop --command just test

  # ------------------------------------------------------------------ e2e ---
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.GARRET_PULLER }}
            extra-trusted-public-keys = ${{ vars.GARRET_PUBLIC_KEY }}
            # The imported closure is locally built and therefore unsigned;
            # only a trusted user may add such a path to the store.
            trusted-users = root runner

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: garret-closure-ubuntu-latest

      # `nix build` after the import is a no-op that only re-creates ./result:
      # the output path is already valid, so nothing is compiled.
      - name: Import the build closure
        run: |
          nix-store --import < closure.nar
          nix build .#garret-all

      - name: End-to-end gate
        # Provisions a throwaway Garage, pushes real store paths through the
        # real client, and substitutes them back with signature verification.
        # GARRET_BIN keeps it from compiling the workspace all over again.
        env:
          GARRET_BIN: ${{ github.workspace }}/result/bin
        run: nix develop --command scripts/e2e.sh

  # ---------------------------------------------------------------- nixos ---
  nixos:
    name: NixOS module test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # enable_kvm (on by default) is what lets the test driver boot its VM
      # with hardware acceleration rather than timing out under emulation.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.GARRET_PULLER }}
            extra-trusted-public-keys = ${{ vars.GARRET_PUBLIC_KEY }}
            # The imported closure is locally built and therefore unsigned;
            # only a trusted user may add such a path to the store.
            trusted-users = root runner

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: garret-closure-ubuntu-latest

      # The VM runs the packages this closure already holds, so what gets
      # built below is the test, not garret.
      - name: Import the build closure
        run: nix-store --import < closure.nar

      - name: NixOS module test
        # Boots the pusher and puller modules and checks the service-user
        # boundary between them (ADR-0009).
        run: nix build .#checks.x86_64-linux.module --print-build-logs

  # ----------------------------------------------------------------- push ---
  # Populates the cache with this build's outputs and the dev toolchain, so
  # later runs substitute instead of compiling. Skipped until garret is
  # actually running: set the GARRET_ENDPOINT repository variable to enable it.
  push:
    name: push to garret
    runs-on: ubuntu-latest
    needs: [lint, build, test, e2e, nixos]
    # Only what lands on main or a release tag is cached, so pull requests
    # never push. Manual dispatch is allowed too: only collaborators can
    # trigger it, and it is the way to verify the cache without waiting for a
    # merge.
    if: >-
      vars.GARRET_ENDPOINT != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      # Lets the runner mint the OIDC token garret validates by owner id.
      # No secret is stored anywhere; the token is minted per push and expires.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.GARRET_PULLER }}
            extra-trusted-public-keys = ${{ vars.GARRET_PUBLIC_KEY }}
            # The imported closure is locally built and therefore unsigned;
            # only a trusted user may add such a path to the store.
            trusted-users = root runner

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: garret-closure-ubuntu-latest

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: garret-closure-macos-latest
          path: darwin

      - name: Import the build closures
        # Takes the place of a second `nix build .#garret-all`: the paths come
        # from the build job, so a cold cache costs one compile per run, not two.
        # A store path is a store path — a linux runner can hold and push the
        # darwin closure it could never execute.
        run: |
          nix-store --import < closure.nar
          nix-store --import < darwin/closure.nar
          nix build .#garret-all

      - name: Realise the dev toolchain
        # The devshell closure is most of what a CI run needs; caching it is
        # what makes later runs cheap.
        run: nix develop --profile toolchain --command true

      - name: Configure the client
        run: |
          mkdir -p ~/.config/garret
          cat > ~/.config/garret/config.toml <<EOF
          endpoint = "${{ vars.GARRET_ENDPOINT }}"
          jobs = ${{ vars.GARRET_JOBS || 8 }}

          [oidc]
          issuer = "https://token.actions.githubusercontent.com"
          audience = "${{ vars.GARRET_AUDIENCE || 'garret' }}"
          EOF

      - name: Push build outputs and toolchain
        # The client walks each closure itself, so dependencies come along.
        run: |
          # shellcheck disable=SC2046
          ./result/bin/garret push $(cat out-paths.txt darwin/out-paths.txt) ./toolchain
