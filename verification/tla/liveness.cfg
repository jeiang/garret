\* Orphan blobs are transient. The sweep is periodic and fair, so the run has
\* no end state: run with -deadlock. No symmetry (unsound with liveness).
SPECIFICATION FairSpec
CONSTANTS
    Hashes = {h1, h2}
    Uploaders = {u1}
    Sizes = {1}
    High = 1
    Low = 0
    Budget = 4
    MaxFaults = 1
    DeleteClaims = TRUE
    EvictRecheck = TRUE
    SweepRecheck = TRUE
    FsckRecheck = TRUE
    ExternalFaults = FALSE
    PeriodicSweep = TRUE
PROPERTY OrphanTransient
